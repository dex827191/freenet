# ══════════════════════════════════════════════════════════════════
# 🔧 LOAD DYNAMIC MODULE (nginx-full Ubuntu 22.04)
# ══════════════════════════════════════════════════════════════════
load_module /usr/lib/nginx/modules/ngx_stream_module.so;

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    multi_accept on;
    worker_connections 8192;
    use epoll;
}

# ══════════════════════════════════════════════════════════════════
# 🔀 STREAM — SNI Multiplexer + TLS Terminator
# ══════════════════════════════════════════════════════════════════
stream {
    log_format stream_basic '$remote_addr [$time_local] $protocol $status '
                            '$bytes_sent/$bytes_received '
                            'sni="$ssl_preread_server_name"';
    access_log /var/log/nginx/stream_access.log stream_basic;
    error_log  /var/log/nginx/stream_error.log warn;

    upstream ssh_direct      { server 127.0.0.1:22; }
    upstream tls_terminator  { server 127.0.0.1:2443; }
    upstream ws_backend      { server 127.0.0.1:8880; }

    map $ssl_preread_protocol $ssh_or_tls {
        default      ws_backend;
        "TLSv1.0"    tls_terminator;
        "TLSv1.1"    tls_terminator;
        "TLSv1.2"    tls_terminator;
        "TLSv1.3"    tls_terminator;
    }

    # Port publik (Railway TCP Proxy → 8443)
    server {
        listen 8443;
        proxy_pass $ssh_or_tls;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout        600s;
    }

    # TLS Terminator (pengganti Stunnel)
    server {
        listen 2443 ssl;
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_handshake_timeout 15s;

        proxy_pass            ssh_direct;
        proxy_connect_timeout 10s;
        proxy_timeout         600s;
    }
}

# ══════════════════════════════════════════════════════════════════
# 🌐 HTTP — Panel UI + WebSocket/HTTPUpgrade Forwarding
# ══════════════════════════════════════════════════════════════════
http {
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    autoindex off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 32M;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 16k;

    # ── Map upgrade header (WS + HTTPUpgrade) ──
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Cloudflare real IP ──
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ── Upstream Node (keepalive pool) ──
    upstream xray_upgrade {
        server 127.0.0.1:8081;
        keepalive                 64;
        keepalive_requests        10000;
        keepalive_timeout         600s;
    }

    # ══════════════════════════════════════════════════════════
    # Server: Panel UI + HTTPUpgrade endpoints
    # ══════════════════════════════════════════════════════════
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # ✅ HTTPUpgrade / WS / Info pages
        location ~* ^/(vless-argo|vmess-argo|trojan-argo|httpupgrade) {
            proxy_pass http://xray_upgrade;
            proxy_http_version 1.1;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

            proxy_connect_timeout 60s;
            proxy_read_timeout    600s;
            proxy_send_timeout    600s;

            proxy_buffering         off;
            proxy_request_buffering off;
            proxy_socket_keepalive  on;
            proxy_cache_bypass      $http_upgrade;
            proxy_redirect          off;
        }

        # Catch-all (UI panel, API, SSH WS, dll)
        location / {
            proxy_pass http://xray_upgrade;
            proxy_http_version 1.1;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

            proxy_connect_timeout 60s;
            proxy_read_timeout    600s;
            proxy_send_timeout    600s;

            proxy_buffering         off;
            proxy_request_buffering off;
            proxy_socket_keepalive  on;
            proxy_cache_bypass      $http_upgrade;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
