# ══════════════════════════════════════════════════════════════════
# 🔧 LOAD DYNAMIC MODULES (WAJIB untuk paket nginx-full Ubuntu 22.04)
# ══════════════════════════════════════════════════════════════════
load_module /usr/lib/nginx/modules/ngx_stream_module.so;

user www-data;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    multi_accept on;
    worker_connections 8192;
    use epoll;
}

# ══════════════════════════════════════════════════════════════════
# 🔀 STREAM — Multiplexer (:8443) + TLS Terminator (:2443)
# ══════════════════════════════════════════════════════════════════
stream {
    log_format stream_basic '$remote_addr [$time_local] $protocol $status '
                            '$bytes_sent/$bytes_received '
                            'sni="$ssl_preread_server_name"';
    access_log /var/log/nginx/stream_access.log stream_basic;
    error_log  /var/log/nginx/stream_error.log warn;

    # ── Backend: Dropbear SSH langsung ────────────────────────
    upstream ssh_direct {
        server 127.0.0.1:22;
    }

    # ── Backend: Nginx TLS Terminator ─────────────────────────
    upstream tls_terminator {
        server 127.0.0.1:2443;
    }

    # ── Backend: WS Proxy (Go) ────────────────────────────────
    upstream ws_backend {
        server 127.0.0.1:8880;
    }

    # ── Map: deteksi TLS via ssl_preread ──────────────────────
    map $ssl_preread_protocol $ssh_or_tls {
        default      ws_backend;      # non-TLS → wsproxy
        "TLSv1.0"    tls_terminator;
        "TLSv1.1"    tls_terminator;
        "TLSv1.2"    tls_terminator;
        "TLSv1.3"    tls_terminator;
    }

    # ── PORT PUBLIK (expose via Railway TCP Proxy → 8443) ─────
    server {
        listen 8443;
        proxy_pass $ssh_or_tls;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout        600s;
    }

    # ── TLS TERMINATOR (pengganti Stunnel) ────────────────────
    # ✅ TIDAK ada 'default_server' — tidak valid di stream
    # Semua SNI otomatis diterima karena hanya satu listen di port ini
    server {
        listen 2443 ssl;
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_handshake_timeout 15s;

        proxy_pass            ssh_direct;
        proxy_connect_timeout 10s;
        proxy_timeout         600s;
    }
}

# ══════════════════════════════════════════════════════════════════
# 🌐 HTTP — Panel UI (Node server.cjs) + WebSocket forward
# ══════════════════════════════════════════════════════════════════
http {
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    autoindex off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    client_max_body_size 32M;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 16k;

    # ── Map upgrade header WebSocket (WAJIB di dalam http) ────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Restore IP asli di belakang Cloudflare ────────────────
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # ── Reverse Proxy ke server.cjs (8081) ────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering    off;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
